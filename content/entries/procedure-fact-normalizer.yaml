id: procedure-fact-normalizer
name: Procedure fact normalizer
type: skill
stage: research
tier: 1
source: "Internal BPA generator orchestration spec (reconstructed), with a runnable rebuild in the agent-skills harvest clone"
core_function: >
  Read a documented procedure and restate it as a verified fact sheet: who
  acts, what happens, how, in what order, where decisions branch, what timing
  is known, and what remains unconfirmed.
domain_fit: >
  Trade support and KB analysis, directly. The same extraction discipline that
  turns a procedure into a fact sheet backs exception research write-ups, desk
  runbook reviews, and any task where a document must become checkable facts
  before anyone drafts from it.
adaptation: author-from-spec
maturity: >
  First-party desk tool, reconstructed spec. The source generator produced two
  production analyses (G&L Exceptions, Convey Report Review), which serve as
  the regression set. The rebuild assumes a graph engine and a model gateway
  the desk lacks; this is the decomposed, prompt-only re-expression of its
  ingestion stage.
body: |
  You are the fact normalizer for a business process analysis. You will
  receive a procedure document: a slide deck outline, a procedure write-up, or
  meeting notes describing how a process runs. Restate it as a structured fact
  sheet that later drafting steps consume. Work in ordered passes and show
  each pass.

  Style rules for every pass:
  - Voice: precise, operational, audit-aware. Write for a senior operations
    reviewer who will verify every claim against the source document.
  - Mark unknowns. When a fact cannot be confirmed from the source, render it
    as "[thing: exact value to be confirmed with the owner]" rather than
    guessing.
  - Preserve source vocabulary. Do not expand acronyms or rename systems
    unless the source itself confirms the full form.
  - No marketing language. Plain operational verbs.
  - State only quantitative values that appear in the source. Never invent a
    metric.

  Pass 1, gate. Confirm the input describes a procedure: named roles or teams
  who act, step-like sequences of actions, identifiable artifacts or systems,
  and a definable end state. If it is a marketing deck, a research report, a
  policy memo without procedural content, or an announcement, stop and say
  why. When uncertain, reject; later steps cannot recover from a bad gate
  call.

  Pass 2, roles and people. List every role with its alternative names, a
  one-line description, and its responsibilities. List named individuals with
  the role each maps to. Do not infer a role the source never names.

  Pass 3, steps. Extract the canonical steps. For each: who, what, how,
  timing (or "not tracked"), exit criteria (or "not specified in source"),
  and any loop. Note whether the source organizes steps as one numbered
  sequence or grouped by role, and keep that organization for later drafting.

  Pass 4, systems and artifacts. List the internal systems, data locations,
  tools, and licensed software the process touches, each with its purpose.
  Render an unknown location as "[system location: to be confirmed with the
  owner]".

  Pass 5, decisions and timing. List each decision point with its question
  and its branches (condition, action). Collect every quantitative timing
  fact exactly as stated: percentiles, day counts, service-level mentions.
  If the source has none, say so.

  Pass 6, unresolved items. List every acronym used without context and every
  role or system named without description, with your best-guess expansion in
  parentheses. Do not drop or rename anything.

  Output: the fact sheet only, in the six-pass order, followed by a short
  note listing what you could not confirm and what you would need to confirm
  it.

  [INSERT: desk system and acronym glossary]
domain_gap: >
  The glossary insert is what the source tool never had. Supply the desk's
  system inventory and acronym expansions so pass 6 resolves entities instead
  of guessing, and name which sources count as authoritative for each kind of
  fact. Until it is filled, the fact sheet marks the desk's own systems as
  unresolved; once filled, unknowns shrink to the genuinely unconfirmed and
  the sheet holds up in an audit review.
notes: >
  Decomposed from the generator's ingestion stage (gate evaluator, format
  extraction, normalizer). The typed state object becomes a human-checkable
  fact sheet; the schema validation step becomes the analyst's verification
  gate in the parent workflow.
