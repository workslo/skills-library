id: business-process-analysis-workflow
name: Business process analysis workflow
type: workflow
stage: research
tier: 1
source: "Internal BPA generator orchestration spec (reconstructed), with a runnable rebuild in the agent-skills harvest clone"
domain_fit: >
  Trade support, KB analysis, and leadership reporting. Turns any desk
  procedure into the analysis document that runbook rewrites, training, and
  tooling-investment decisions read from, with every fact traceable to the
  source document.
maturity: >
  First-party desk tool, reconstructed spec. The source generator ran as a
  staged pipeline (gate, extraction, nine parallel section writers,
  deterministic assembly) and produced two production analyses, G&L
  Exceptions and Convey Report Review, which remain the reference for shape
  and depth. The parallel fan-out becomes sequential prompts here because an
  analyst runs one conversation at a time; the shared state object becomes a
  verified fact sheet carried between steps.
trigger: >
  A desk procedure needs durable documentation, a KB article needs a rewrite,
  a new-hire runbook is missing, or leadership asks which processes are
  candidates for tooling investment.
steps:
  - title: Gate the source document
    prompt: |
      Confirm the document describes a procedure or business process: named roles or teams who act, step-like sequences of actions, identifiable systems or artifacts, and a definable end state. Marketing decks, research reports, policy memos without procedural content, and announcements fail the gate. Give a go or no-go with one sentence of reasoning and a confidence level. When uncertain, reject; the later steps cannot recover from a bad gate call.
    output: >
      A go or no-go decision with reason and confidence. On no-go, the
      workflow stops here.
  - title: Normalize the facts
    asset: procedure-fact-normalizer
    prompt: |
      Extract the fact sheet in ordered passes: roles and people, steps with who, what, how, and timing, systems and artifacts, decision points and timing facts, unresolved items. Preserve source vocabulary, keep the source's step organization, and mark every unknown as a confirmation placeholder.
    output: >
      A structured fact sheet plus a list of unconfirmed items.
  - title: Draft the summary and components
    prompt: |
      From the verified fact sheet only, draft two sections.

      First the executive summary, one dense paragraph of four to seven sentences covering, in order: the purpose of the process and why it matters to the firm; the key participants as roles, never named individuals; the current state and how the process operates today; the success criteria; and a headline timing figure only if the sheet holds percentile data, using the median. If the sheet has no percentile data, omit quantitative claims entirely.

      Then the components section, four subsections in this exact order:
      1. In-house systems: each system as a bolded bullet with sub-bullets for purpose, usage, and notes.
      2. Data storage: each location with its paths and notes; render an unknown path as "[<system name> location and path: exact value to be confirmed with the system owner]", naming the specific system.
      3. Tools: name the subsection "Technology Tools" when most tools carry the technology category, "Communication Tools" when most carry communication, and "Tools" otherwise; list each tool with its purpose.
      4. Licensed or publicly available software.

      Format entries consistently. Do not reorder the subsections, and do not omit an empty one; render it with a single sub-bullet reading "None specified in source".
    output: >
      Executive summary and components sections.
  - title: Draft the steps and roles, two views each
    prompt: |
      Render the process twice, then the roles twice.

      Step summary: a flat numbered list of the canonical steps. For each step, four single-line sub-bullets: who (role names), what (a one-sentence summary of the action), how (a one-phrase mechanism), and timing (one phrase, or "Not tracked"). Keep decision points, loops, and exit criteria out of this view; it is the high-level overview.

      Detailed steps: follow the organization the fact sheet recorded. For a numbered-sequence source, use hierarchical numbering (1, 1.1, 1.2, 2, 2.1) with named subfields per step: who, what, how, decision point and loop where present, timing, and exit criteria on every step. For a role-grouped source, use headers in the form "Role: step name" with who, what, how, and timing sub-bullets, leaving decision point and loop fields out. Render each decision point as its question with one line per branch, condition then action. Render each loop as one line describing the cycle.

      Responsibilities list: one bolded bullet per role with a single consolidated sub-bullet summarizing its responsibilities. Compress to one sub-bullet per role even when there are many; this is the at-a-glance view.

      Detailed roles: for each role, a header with the role name and any alternative names in parentheses, a two-to-four sentence description of its place in the process, then a responsibilities subheading with one sub-bullet per discrete responsibility. Attach named individuals where the sheet attributes them, as "Role name (Person name)". Render unresolved entities verbatim with their placeholder label and parenthesized best-guess expansion.
    output: >
      Four sections: step summary, detailed steps, responsibilities list,
      detailed roles.
  - title: Classify patterns and summarize timing and decisions
    prompt: |
      Produce three readouts from the fact sheet.

      Pattern table: map each step to the fixed taxonomy, using these exact category labels and no others: Collect Data, Transform Data, Input/Visualize/Publish Data, Manage Workitems, Take Action. A step may match several categories; a category may match none. Render a two-column table, pattern versus instances across the process, including only categories with at least one match, and list each match as "Step n: one-sentence summary".

      Time estimate: when the sheet holds percentiles, render bands: best case from zero to the median, typical from the median to the 75th percentile, complex from the 75th to the 95th (naming the 90th and 95th), and an outlier band only when the sheet records a maximum, anchored at that recorded value and rendered open-ended from it. Close by stating what the figures measure, from which start event to which end event, what they exclude, and any recurring review cycle or third-party dependency that can extend a case past the bands. When the sheet holds day counts only, list them per step, state the computed total range, and name each service-level gap explicitly. Never invent a number.

      Decisions and exit criteria: a bulleted list of exit criteria, one per step, rendering "Exit criteria: not specified in source" where absent, followed by one note naming the steps that hold explicit decision points.
    output: >
      Pattern table, decision and exit-criteria summary, and the time
      estimate.
  - title: Assess improvement and fit
    asset: process-improvement-fit-assessor
    prompt: |
      Identify five to nine improvement opportunities tied to step numbers, each naming only approved-catalog technologies. Then make the explicit call on generative-assistance fit with internally consistent justification and a human-review caveat.
    output: >
      The opportunities list and the fit assessment.
  - title: Assemble and verify
    prompt: |
      Place every section into the master outline in fixed order: executive summary, components, process step summary, responsibilities by role, roles, steps, time estimate, decision points, common patterns, improvement opportunities, fit assessment. Check every fact against the fact sheet, keep every confirmation placeholder visible, and open the document with the standard notice that the content was machine-drafted and the reader is responsible for verifying it.
    output: >
      The finished process analysis document plus the unconfirmed-items list
      for owner follow-up.
gates:
  - >
    Analyst verifies the normalized fact sheet against the source document
    before any drafting starts; drafting from an unverified sheet propagates
    extraction errors into every section.
  - >
    Analyst confirms every improvement recommendation names only
    approved-catalog technologies before the document circulates.
  - >
    Communication owner approves before the analysis goes to leadership or
    the field, and the process owner confirms or resolves each open
    placeholder.
output: >
  A complete, source-checked business process analysis in the fixed outline,
  with a pattern and timing readout, an approved-catalog improvement list, an
  explicit generative-assistance fit call, and an unconfirmed-items list
  routed to the process owner.
notes: >
  Decomposed from the desk's own generator spec. What survives the
  decomposition: the gate, the fact-sheet contract, the shared style rules,
  the fixed outline, and the sign-off points. What drops: the graph engine,
  the model gateway, and true parallelism, which an analyst replaces by
  running the drafting steps in sequence over one verified sheet.
